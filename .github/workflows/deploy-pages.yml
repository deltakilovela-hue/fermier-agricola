name: Deploy sitio de FERMIER a GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - "brand/**"
      - "contenido-mes1/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Al comprar el dominio propio de FERMIER, cambiar SOLO esta línea (y el DNS).
  SITE_URL: https://fermier.deltakilo.com.mx

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar carpeta de publicación
        run: |
          mkdir -p dist dist/propuesta dist/contenido
          # Sitio principal (landing)
          cp -r landing/. dist/
          sed -i "s#__SITE_URL__#${SITE_URL}#g" dist/index.html dist/robots.txt dist/sitemap.xml
          # Propuesta de marca, ahora en /propuesta/
          cp brand/identidad_de_marca.html dist/propuesta/index.html
          cp brand/og-image.png dist/og-image.png
          # Contenido del mes (los posts programados en GHL leen las imágenes de aquí)
          cp -r contenido-mes1/. dist/contenido/
          # Dominio personalizado
          echo "${SITE_URL#https://}" > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
